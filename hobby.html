<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby-uri</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        @font-face {
            font-family: 'Jacquard12';
            src: url('diomid-surdu.github.io/fonts/Jacquard12.ttf');
        }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #dbf9c8, #114d01);
            color: #333;
        }
        a {
            text-decoration: none;
            color: #00796b;
            font-weight: bold;
            margin: 20px;
            display: inline-block;
        }
        a:hover {
            color: #004d40;
        }
        h1, h2, h3 {
            text-align: center;
            margin: 20px 0;
        }
        h1 {
            font-size: 2.5rem;
            color: #00796b;
        }
        h2 {
            font-size: 1.8rem;
            color: #004d40;
            font-family: 'Jacquard12', sans-serif;
        }
        h3 {
            font-size: 1.2rem;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #ffffff75;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        .hobby {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 20px;
        }
        .hobby:last-child {
            border-bottom: none;
        }
        .hobby img {
            width: 400px;
            height: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-right: 20px;
        }
        .hobby-content {
            flex: 1;
        }
        .hobby-content h2 {
            margin-bottom: 10px;
        }
        .hobby-content p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .hobby-content a {
            display: inline-block;
            margin-top: 10px;
            color: #00796b;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .hobby-content a:hover {
            color: #004d40;
        }

        /*header begin*/
        .header {
            display: flex;
            align-items: right;
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: #5b7236; 
            flex-wrap: wrap; 
            opacity:0.85;
        }

        .nav-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .nav-options a {
            text-decoration: none;
            color: #adb5bd;
            font-size: 1.5rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-options a:hover {
            color: #979083;
            transform: scale(1.1);
        }

    </style>
</head>

<header>
    <div class="header">
        <img src="ressources/logo_placeholder.png" style="width:10rem;height:5rem;margin:.2rem;" alt="mon_logo">
        <nav class="nav-options">
            <a href="index.html" class="pixelify_font">Accueil</a>
            <a href="CV.html" class="pixelify_font">CV</a>
            <a href="hobby.html" class="pixelify_font">Mes Hobbies</a>
            <a href="horaire.html" class="pixelify_font">Portfolio</a>
            <a href="halte.html" class="pixelify_font">Contact</a>
        </nav>
    </div>
</header>

    <main>
        <body>
            <div class="container">
                <h1 class = "coral_font" style="font-size:3rem;">Mes hobbies preférées</h1>

                <div class="hobby">
                    <img src="calator.jpg" alt="hobby">
                    <div class="hobby-content">
                        <h2 class = "pixelify_font">[Hobby]</h2>
                        <p class = 'pixelify_font'>[Description]</p>
                    </div>
                </div>

            </div>

        </body>
    </main>
</html>
