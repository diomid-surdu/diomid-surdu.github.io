    <link rel="stylesheet" href="style.css">
    <style>
    /* HEader */
        .header {
            display: flex;
            align-items: center; /* Align logo and links vertically */
            justify-content: space-between; /* Space between logo and links */
            padding: 1rem 2rem;
            background-color: #212529; /* Header background color */
            flex-wrap: wrap; /* Allow wrapping for smaller screens */
        }

        .nav-options {
            display: flex;
            gap: 2rem; /* Space between links */
            flex-wrap: wrap; /* Allow links to wrap on smaller screens */
            justify-content: flex-start; /* Align links to the left */
        }

        .nav-options a {
            text-decoration: none;
            color: #adb5bd;
            font-size: 1.5rem; /* Adjust font size for better responsiveness */
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-options a:hover {
            color: #979083;
            transform: scale(1.1);
        }

        /* Media Query for Smaller Screens */
        @media (max-width: 768px) {
            .header {
                flex-direction: column; /* Stack the logo and nav links vertically */
                align-items: center; /* Center align the content */
            }

            .nav-options {
                justify-content: center; /* Center the links */
                gap: 1rem; /* Reduce the gap between links */
            }

            .nav-options a {
                font-size: 1.2rem; /* Reduce font size for smaller screens */
            }
        }
    /* HEader end */
    
        body {
            margin: 0;
            font-family: 'Roboto';
            background: linear-gradient(180deg, #13191e, #49586a);
            color: #73877b;
        }
        .container {
            margin: 50px auto;
            width: 90%;
            max-width: 900px;
            background: linear-gradient(135deg, #f5f0e1, #c4a35a);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
        .section {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        h4 {
            font-size: 1rem;
            color: #625b38;
        }
        a {
            text-decoration: none;
            color: #a87405;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #643122;
        }
        img {
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 100%;
            height: auto;
        }
        img:hover {
            transform: scale(1.3);
            /*box-shadow: 5rem 5rem 5rem rgba(255, 255, 255, 0.3);*/
        }
        
    </style>
</head>
